[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ntxp-contacts"
version = "0.1.0"
description = "NTXP master contacts database: one de-duplicated source of truth for all NTXP tools, with idempotent imports and bi-directional CRM sync."
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",      # .xlsx readers
    "xlrd>=2.0",          # legacy .xls readers
    "phonenumbers>=8.13", # E.164 normalization
    "rapidfuzz>=3.0",     # fuzzy identity resolution
    "click>=8.1",         # CLI
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]                  # v1 FastMCP API (stdio + streamable HTTP)
remote = ["mcp>=1.0,<2", "uvicorn>=0.23"]  # stateless cloud MCP over HTTP
ocr = ["pytesseract>=0.3", "pdf2image>=1.17", "Pillow>=10.0"]
postgres = ["psycopg[binary]>=3.1"]   # cloud canonical store (NTXP_DB_URL)
dev = ["pytest>=7.0", "psycopg[binary]>=3.1"]

[project.scripts]
ntxp = "ntxp_contacts.cli:main"

[tool.setuptools.packages.find]
include = ["ntxp_contacts*"]

[tool.setuptools.package-data]
ntxp_contacts = ["db/migrations/*.sql", "remote/*.json", "hooks/*.json", "web/*"]
