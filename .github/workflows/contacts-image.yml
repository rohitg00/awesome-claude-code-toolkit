# Builds the NTXP Contacts image and pushes it to GHCR so the Hostinger Docker Manager can pull it
# (that manager cannot build). Runs on changes under contacts-db/. The proprietary NTXP engine and
# logo are never in the build context — they are mounted at runtime.
name: contacts-image
on:
  push:
    branches: [main]
    paths: ["contacts-db/**", ".github/workflows/contacts-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contacts-db } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tests (SQLite)
        run: pip install -e ".[mcp,remote,postgres,dev]" && pytest -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: contacts-db
          file: contacts-db/deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ntxp-contacts:latest
            ghcr.io/${{ github.repository_owner }}/ntxp-contacts:${{ github.sha }}
